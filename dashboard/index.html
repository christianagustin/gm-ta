<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Global Mode Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0B1F3A; --navy-line:rgba(255,255,255,.10);
    --green:#1F7A4C; --electric:#4ADE80; --danger:#C24E3E; --amber:#B4820F;
    --bg:#F4F6F9; --surface:#FFFFFF; --sunken:#EDF1F5;
    --line:#E2E8EE; --line-soft:#EDF1F5;
    --text:#16233A; --muted:#5A6B7D; --muted-2:#8595A5;
    --crit-bg:#FBEBE8; --warn-bg:#FBF3E2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;
    font-feature-settings:"tnum" 1;font-size:15px;line-height:1.5}
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px 72px}
  .num{font-variant-numeric:tabular-nums}
  a{color:inherit}

  header{background:var(--navy);color:#fff;padding:26px 0 22px}
  header .wrap{padding-bottom:0}
  .brand{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:var(--electric);font-weight:700}
  .htop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:9px}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:31px;margin:0;letter-spacing:-.2px}
  .fresh{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#9FB3C8;margin-top:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--electric);flex-shrink:0;
    box-shadow:0 0 0 0 rgba(74,222,128,.55);animation:p 2.2s infinite}
  .dot.stale{background:var(--danger);animation:none}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
  .btn-ghost{font-family:inherit;font-size:12px;font-weight:700;color:#C5D2E0;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:8px 15px;cursor:pointer}
  .btn-ghost:hover{background:rgba(74,222,128,.16);border-color:var(--electric);color:#fff}

  .ctrl{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
  .ctrl-in{max-width:1160px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ctrl-lbl{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;font-weight:700;color:var(--muted-2)}
  .pset{display:inline-flex;gap:5px;flex-wrap:wrap}
  .pbtn{font-family:inherit;font-size:12px;font-weight:600;background:transparent;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;transition:.12s}
  .pbtn:hover{border-color:var(--green);color:var(--green)}
  .pbtn.on{background:var(--green);border-color:var(--green);color:#fff}
  .dt{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;color:var(--text);background:var(--surface)}
  .capply{font-family:inherit;font-size:12px;font-weight:700;background:var(--navy);color:#fff;border:none;border-radius:6px;padding:7px 13px;cursor:pointer}
  .cgrp{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}
  .rng-out{margin-left:auto;font-size:12px;font-weight:600;color:var(--green)}
  .sep{width:1px;height:22px;background:var(--line)}

  .stale-banner{display:none;background:var(--warn-bg);border:1px solid #EBD9AE;color:#8A6212;
    border-radius:9px;padding:10px 14px;font-size:13px;margin-top:16px}
  .stale-banner.show{display:block}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px 13px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
  .kpi.warn::before{background:var(--amber)} .kpi.crit::before{background:var(--danger)}
  .kpi .lab{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--muted-2)}
  .kpi .val{font-family:'DM Serif Display',serif;font-size:27px;line-height:1.1;margin:7px 0 3px}
  .kpi .val .sm{font-size:14px;color:var(--muted);font-family:'DM Sans',sans-serif}
  .kpi .ctx{font-size:11.5px;color:var(--muted);line-height:1.4}
  .delta{font-weight:700}
  .up{color:var(--green)} .down{color:var(--danger)} .flat{color:var(--muted-2)}

  .alerts{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .al{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
  .al.c{background:var(--crit-bg);border-color:rgba(194,78,62,.28)}
  .al.w{background:var(--warn-bg);border-color:rgba(180,130,15,.28)}
  .al .tag{font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;padding:3px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:1px}
  .al.c .tag{background:var(--danger);color:#fff}
  .al.w .tag{background:var(--amber);color:#fff}

  .tabbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:24px;flex-wrap:wrap}
  nav.tabs{display:inline-flex;gap:4px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto}
  .tab{font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;
    border-radius:7px;padding:8px 15px;cursor:pointer;white-space:nowrap;transition:.12s}
  .tab:hover{color:var(--text)}
  .tab.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(11,31,58,.13);font-weight:700}
  .viewtog{display:inline-flex;gap:3px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:4px}
  .vbtn{font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;
    border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .vbtn:hover{color:var(--text)}
  .vbtn.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(11,31,58,.13)}
  .tp{display:none;padding-top:20px}
  /* TA Links & Guide, Mastersheet tabs: no period filter or KPIs there */
  body.tab-team:not(.fullview) #ctrl,body.tab-team:not(.fullview) #kpis,body.tab-team:not(.fullview) #alerts,body.tab-team:not(.fullview) #stale,
  body.tab-master:not(.fullview) #ctrl,body.tab-master:not(.fullview) #kpis,body.tab-master:not(.fullview) #alerts,body.tab-master:not(.fullview) #stale{display:none!important}
  .xt{width:100%;border-collapse:collapse;font-size:13px}
  .xt th{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-2);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .xt td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  .xt a{color:var(--green);font-weight:700;text-decoration:none;white-space:nowrap}
  .xscroll{overflow-x:auto}
  .xbtn{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--navy);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
  .xbtn:hover{border-color:var(--green);color:var(--green)}
  .xin{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--text);background:var(--surface)}
  .steps{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--text)}
  .steps li{margin-bottom:10px}.steps b{color:var(--navy)}
  .when{display:inline-block;min-width:68px;font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px}
  .chg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .chg h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .chg ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunken);color:var(--muted)}
  .tag.g{background:#E7F4EC;color:var(--green)}
  @media (max-width:760px){.chg{grid-template-columns:1fr}}
  .tp.on{display:block}
  body.fullview .tabbar nav.tabs{display:none}
  body.fullview .tabbar{justify-content:flex-end}
  body.fullview .tp{display:block!important;padding-top:0;margin-top:26px}
  body.fullview .tp::before{content:attr(data-name);display:block;font-family:'DM Serif Display',serif;
    font-size:20px;color:var(--navy);padding:8px 0 2px;border-top:1px solid var(--line);margin-top:8px}
  body.fullview .tp.on:first-of-type::before,body.fullview #t-overview::before{border-top:none;margin-top:0}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
  .panel.dark{background:var(--navy);border-color:transparent;color:#fff}
  .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .pt{font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .panel.dark .pt{color:var(--electric)}
  .pmeta{font-size:11.5px;color:var(--muted-2)}
  .panel.dark .pmeta{color:#9FB3C8}
  .grid-eq{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .cap{font-size:11.5px;color:var(--muted-2);margin-top:11px;font-style:italic}

  .ins{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;position:relative;overflow:hidden}
  .ins::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--danger)}
  .ins.w::before{background:var(--amber)}
  .ins .k{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;color:var(--muted-2)}
  .ins .big{font-family:'DM Serif Display',serif;font-size:32px;line-height:1.05;margin:7px 0 5px}
  .ins p{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .ins p b{color:var(--text)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:2px}
  .pill.c{background:var(--crit-bg);color:var(--danger)} .pill.w{background:var(--warn-bg);color:var(--amber)}
  .pill.g{background:rgba(31,122,76,.12);color:var(--green)}

  .track{background:var(--sunken);border-radius:6px;height:11px;overflow:hidden;margin:11px 0 5px}
  .track > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#2FA96B);border-radius:6px;transition:width .7s cubic-bezier(.34,1.06,.4,1)}
  .tscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted-2)}

  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:430px}
  th{font-size:10.5px;letter-spacing:.65px;text-transform:uppercase;color:var(--muted-2);font-weight:700;text-align:left;padding:0 12px 9px 0;border-bottom:1px solid var(--line)}
  td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.r,th.r{text-align:right}
  .nm{font-weight:700}
  .bar{display:inline-block;height:7px;border-radius:4px;vertical-align:middle;margin-right:8px;min-width:4px}
  .best{color:var(--green);font-weight:700} .worst{color:var(--danger);font-weight:700}
  .muted{color:var(--muted-2)}
  .inact{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted-2);background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:7px;vertical-align:middle}

  .bars{display:flex;align-items:flex-end;gap:6px;height:132px;margin-top:4px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bfill{width:64%;max-width:36px;border-radius:4px 4px 0 0;background:#93AFC4;position:relative;
    transition:height .6s cubic-bezier(.34,1.06,.4,1)}
  .bcol.faded .bfill{opacity:.42}
  .bcol.faded .bx{opacity:.6}
  .bfill.hi{background:var(--danger)} .bfill.g{background:var(--green)}
  .bfill span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;white-space:nowrap;color:var(--text)}
  .bx{font-size:10.5px;color:var(--muted-2);margin-top:6px}
  .bd{font-size:10px;font-weight:700;margin-top:2px}

  .fn{display:grid;grid-template-columns:158px 1fr 58px;align-items:center;gap:12px;padding:9px 0}
  .fnl{font-size:13px;font-weight:700}
  .fnt{background:var(--sunken);border-radius:6px;height:20px;overflow:hidden}
  .fnf{height:100%;border-radius:6px;transition:width .65s cubic-bezier(.34,1.06,.4,1)}
  .fnc{text-align:right;font-weight:700;font-size:13px}

  .hb{display:grid;grid-template-columns:150px 1fr 62px;align-items:center;gap:12px;padding:7px 0}
  .hbl{font-size:13px;font-weight:700}
  .hbt{background:var(--sunken);border-radius:6px;height:18px;overflow:hidden}
  .hbf{height:100%;border-radius:6px;background:var(--green);transition:width .6s cubic-bezier(.34,1.06,.4,1)}
  .hbv{text-align:right;font-weight:700;font-size:13px}
  .mtog{display:inline-flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
  .mbtn{font-family:inherit;font-size:11px;font-weight:600;color:var(--muted);background:var(--sunken);
    border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
  .mbtn:hover{border-color:var(--green);color:var(--green)}
  .mbtn.on{background:var(--green);border-color:var(--green);color:#fff}
  select.dt{cursor:pointer}
  .pline{stroke-dasharray:1;stroke-dashoffset:1;animation:lineDraw 1.05s ease forwards}
  @keyframes lineDraw{to{stroke-dashoffset:0}}

  .info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:6px;
    border-radius:50%;border:1px solid var(--line);color:var(--muted-2);font-family:Georgia,serif;font-style:italic;
    font-weight:700;font-size:10px;line-height:1;cursor:help;vertical-align:middle;user-select:none}
  .info:hover{border-color:var(--green);color:var(--green)}

  .tip{position:fixed;pointer-events:none;background:#071528;color:#fff;border:1px solid rgba(255,255,255,.12);
    border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.5;z-index:60;opacity:0;transition:opacity .1s;
    box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:290px}
  .tip.show{opacity:1}
  .tip .tt{font-weight:700;color:var(--electric);margin-bottom:3px}
  .tip .tr{color:#C5D2E0} .tip .tr b{color:#fff}

  svg{display:block;width:100%;height:auto}
  .empty{font-size:13px;color:var(--muted-2);padding:14px 0}
  #loading,#error{text-align:center;padding:80px 20px;color:var(--muted);font-size:14px}
  #error{color:var(--danger);display:none}
  #app{display:none}

  .srcl{font-size:11px;color:var(--muted-2);text-decoration:none}
  .srcl:hover{color:var(--green)}

  @media (max-width:1000px){ .kpis{grid-template-columns:repeat(3,1fr)} .grid-eq{grid-template-columns:1fr} }
  @media (max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr)} h1{font-size:25px} .rng-out{margin-left:0;width:100%} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important} .pline{stroke-dashoffset:0!important}}
  @media print{
    .ctrl,nav.tabs,.btn-ghost,.stale-banner{display:none!important}
    .tp{display:block!important;page-break-inside:avoid}
    .tp::before{content:attr(data-name);display:block;font-size:12px;font-weight:700;text-transform:uppercase;
      letter-spacing:.8px;color:var(--muted);padding:16px 0 6px;border-top:1px solid var(--line);margin-top:16px}
    .panel,.ins,.kpi{break-inside:avoid}
    .panel.dark{background:#fff!important;color:var(--text)!important;border:1px solid var(--line)!important}
    .panel.dark .pt{color:var(--muted)!important}
    body{background:#fff}
    .bars,.fnt,.track,.bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .pline{stroke-dashoffset:0!important}
  }
</style>
<style>
.leaflet-tooltip.gm-count{background:transparent;border:none;box-shadow:none;color:#fff;font-weight:700;font-size:11px;padding:0;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.leaflet-tooltip.gm-count::before{display:none}
</style>
<style>
/* ---- sidebar shell (Oct 2026) ---- */
.shell{display:flex;min-height:100vh;align-items:stretch}
.side{width:232px;flex-shrink:0;background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:24px 14px 18px;z-index:50;overflow-y:auto}
.side-brand{padding:0 10px 4px}
.side .client{font-family:'DM Serif Display',Georgia,serif;font-size:22px;line-height:1.15;margin-top:4px;color:#fff}
.snav-lbl{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#6F86A0;font-weight:700;padding:0 12px;margin:26px 0 8px}
.snav{display:flex;flex-direction:column;gap:3px}
.snav .tab{display:flex;align-items:center;gap:11px;width:100%;text-align:left;color:#B8C7D8;background:none;border:none;
  border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.12s;white-space:normal}
.snav .tab svg{width:17px;height:17px;flex-shrink:0;opacity:.75}
.snav .tab:hover{background:rgba(255,255,255,.07);color:#fff}
.snav .tab.on{background:rgba(74,222,128,.13);color:#fff;box-shadow:inset 3px 0 0 var(--electric);font-weight:700}
.snav .tab.on svg{opacity:1;color:var(--electric)}
.snav .tab:focus-visible,.vbtn:focus-visible,.menu-btn:focus-visible{outline:2px solid var(--electric);outline-offset:2px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:22px 4px 0}
.side .viewtog{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:3px}
.side .vbtn{flex:1;color:#9FB3C8;padding:7px 8px;font-size:11.5px}
.side .vbtn:hover{color:#fff}
.side .vbtn.on{background:#fff;color:var(--navy);box-shadow:none}
.side .btn-ghost{width:100%}
.main{flex:1;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0}
.topbar-in{max-width:1160px;margin:0 auto;padding:20px 22px 14px;display:flex;align-items:center;gap:14px}
.topbar h1{color:var(--navy);font-size:28px}
.topbar .fresh{color:var(--muted);margin-top:5px}
.menu-btn{display:none;flex-direction:column;justify-content:center;gap:4px;width:40px;height:40px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:0 10px;flex-shrink:0}
.menu-btn span{display:block;height:2px;background:var(--navy);border-radius:2px}
.scrim{display:none}
.ctrl{top:0}
body:not(.tab-overview):not(.fullview) #kpis,body:not(.tab-overview):not(.fullview) #alerts{display:none}
body.fullview .tp.on:first-of-type::before{border-top:none}
.tp{padding-top:22px;scroll-margin-top:118px}
.updated-flash{color:var(--green);font-weight:700}
/* TA activity panel */
.act-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.act-kpis .kpi{padding:12px 14px 11px}
.act-kpis .kpi .val{font-size:24px;margin:5px 0 2px}
.zero{color:var(--muted-2)}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;height:100%;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.navopen .side{transform:none}
  body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(7,21,40,.45);z-index:45}
  .menu-btn{display:flex}
  .ctrl{position:static}
  .tp{scroll-margin-top:12px}
  .topbar-in{padding:14px 16px 12px}
  .topbar h1{font-size:23px}
  .wrap,.ctrl-in{padding-left:16px;padding-right:16px}
  .act-kpis{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
@media print{
  .side,.scrim,.menu-btn{display:none!important}
  .shell{display:block}
  body #kpis,body #alerts{display:grid!important}
  body #alerts{display:flex!important}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="side" id="side" aria-label="Dashboard sections">

      <div class="brand">Workchestra</div>

    </div>
    <div class="snav-lbl">Dashboard</div>
    <nav class="snav" id="tabs"></nav>
    <div class="side-foot">
      <div class="snav-lbl" style="margin:0 0 2px;padding:0 4px">Layout</div>
      <div class="viewtog" id="viewtog">
        <button class="vbtn on" data-v="tabs" title="Show one section at a time">One section</button>
        <button class="vbtn" data-v="full" title="Show every section on one scroll">Full view</button>

    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-in">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu"><span></span><span></span><span></span></button>
        <div>
          <h1 id="ptitle">Overview</h1>
          <div class="fresh"><span class="dot" id="dot"></span><span id="fresh">Loading&hellip;</span></div>
        </div>
      </div>
    </header>

<div class="ctrl" id="ctrl" style="display:none">
  <div class="ctrl-in">
    <span class="ctrl-lbl">Period</span>
    <span class="pset" id="psets"></span>
    <span class="sep"></span>
    <span class="cgrp">
      <input type="date" id="df" class="dt" /><span class="ctrl-lbl">to</span><input type="date" id="dtin" class="dt" />
      <button class="capply" id="apply">Apply</button>
    </span>
    <span class="rng-out" id="rngout"></span>
  </div>
</div>

<div class="wrap">
      <div id="loading">Loading current data&hellip;</div>
      <div id="error">Could not load the latest data. The dashboard updates hourly, please refresh in a few minutes.</div>
      <div id="app">
        <div class="stale-banner" id="stale"></div>
        <div class="kpis" id="kpis"></div>
        <div class="alerts" id="alerts"></div>
        <section class="tp on" id="t-overview" data-name="Overview"></section>
        <section class="tp" id="t-manpower" data-name="Manpower"></section>
        <section class="tp" id="t-retention" data-name="Attendance &amp; Retention"></section>
        <section class="tp" id="t-recruit" data-name="Recruitment"></section>
        <section class="tp" id="t-applicants" data-name="Applicants"></section>
        <section class="tp" id="t-team" data-name="TA Links &amp; Guide"></section>
        <section class="tp" id="t-master" data-name="Mastersheet"></section>
        <footer style="text-align:center;font-size:11px;color:var(--muted-2);padding-top:30px">
          Auto-generated by Workchestra &middot; workchestra.io
        </footer>
      </div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>
<script>
(function () {
  var SOURCE_URL = 'https://drive.google.com/file/d/16zoocFF4biDC4hNquPdvlqMBgnwHZD15/view';
  var STALE_HOURS = 2;
  var M3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTHS = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
  var D1 = null, D2 = null, LT = null, DAILY = [], ATT = [], MIND = null, MAXD = null, mAvgHc = {};
  var state = { from: null, to: null, preset: '6', tab: 'overview', view: 'tabs', taSel: '__all__', taMetric: 'endorsed', locScope: 'all' };
  var INACTIVE_TAS = { 'TA5': 1, 'TA6': 1 };

  // ---------- utils ----------
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(n) { return (n == null || isNaN(n)) ? '\u2014' : Math.round(n).toLocaleString('en-US'); }
  function f1(n) { return (n == null || isNaN(n)) ? '\u2014' : n.toFixed(1); }
  function f2(n) { return (n == null || isNaN(n)) ? '\u2014' : n.toFixed(2); }
  function dlab(iso) { var d = new Date(iso + 'T00:00:00'); return M3[d.getMonth()] + ' ' + d.getDate(); }
  function addDays(iso, n) { var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000) + 1; }
  function mnum(iso) { return +iso.slice(5, 7); }
  function mn3(m) { return m ? m.slice(0, 1) + m.slice(1, 3).toLowerCase() : '\u2014'; }
  function avg(a) { return a.length ? a.reduce(function (s, v) { return s + v; }, 0) / a.length : null; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function clampLo(x) { return x < MIND ? MIND : x; }
  function clampHi(x) { return x > MAXD ? MAXD : x; }
  function dailyIn(f, t) { return DAILY.filter(function (r) { return r[0] >= f && r[0] <= t; }); }
  function attIn(f, t) { return ATT.filter(function (r) { return r[0] >= f && r[0] <= t; }); }
  function monthsIn(f, t) { var s = {}; dailyIn(f, t).forEach(function (r) { s[mnum(r[0])] = 1; }); return Object.keys(s).map(Number); }
  function attrRate(t) { var a = mAvgHc[t.monthNum]; return (a && t.attrition != null) ? Math.round(t.attrition / a * 1000) / 10 : null; }
  function deltaEl(v, unit, goodUp) {
    if (v == null || isNaN(v)) return '<span class="flat">no prior period</span>';
    var cls = v === 0 ? 'flat' : ((v > 0) === !!goodUp ? 'up' : 'down');
    var ar = v > 0 ? '\u25B2' : v < 0 ? '\u25BC' : '\u25CF';
    return '<span class="delta ' + cls + '">' + ar + ' ' + (v > 0 ? '+' : '') + (unit === 'pp' ? v.toFixed(2) + 'pp' : fmt(v)) + '</span>';
  }

  // ---------- tooltip ----------
  var tipEl = document.getElementById('tip');
  function showTip(html, x, y) {
    tipEl.innerHTML = html; tipEl.classList.add('show');
    var p = 14, tx = x + p, ty = y + p, r = tipEl.getBoundingClientRect();
    if (tx + r.width > window.innerWidth - 8) tx = x - r.width - p;
    if (ty + r.height > window.innerHeight - 8) ty = y - r.height - p;
    tipEl.style.left = tx + 'px'; tipEl.style.top = ty + 'px';
  }
  function hideTip() { tipEl.classList.remove('show'); }
  function wireInfo(root) {
    root.querySelectorAll('.info').forEach(function (i) {
      i.addEventListener('mouseenter', function () { var r = i.getBoundingClientRect(); showTip(i.dataset.tip, r.left + r.width / 2, r.bottom); });
      i.addEventListener('mouseleave', hideTip);
    });
  }
  function info(title, body) { return '<span class="info" data-tip="' + esc('<div class=\'tt\'>' + title + '</div><div class=\'tr\'>' + body + '</div>') + '">i</span>'; }

  // ---------- charts ----------
  function lineChart(pts, opt) {
    opt = opt || {};
    if (!pts.length) return '<div class="empty">No data in this period.</div>';
    var w = 960, h = opt.h || 176, pl = 46, pr = 12, ptp = 14, pb = 26;
    var vals = pts.map(function (p) { return p[1]; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    var spread = (mx - mn) || 1, lo = mn - spread * .18, hi = mx + spread * .18;
    var rng = hi - lo, pw = w - pl - pr, ph = h - ptp - pb;
    var step = pw / Math.max(pts.length - 1, 1);
    var yp = function (v) { return ptp + ph * (1 - (v - lo) / rng); };
    var xp = function (i) { return pl + i * step; };
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + xp(i).toFixed(1) + ',' + yp(p[1]).toFixed(1); }).join(' ');
    var area = line + ' L' + xp(pts.length - 1).toFixed(1) + ',' + (ptp + ph) + ' L' + xp(0).toFixed(1) + ',' + (ptp + ph) + ' Z';
    var grid = '', ylab = '', gcol = opt.dark ? 'rgba(255,255,255,.10)' : '#EDF1F5', tcol = opt.dark ? '#7E93AC' : '#8595A5';
    for (var t = 0; t <= 4; t++) {
      var v = lo + rng / 4 * t, y = yp(v);
      grid += '<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (w - pr) + '" y2="' + y.toFixed(1) + '" stroke="' + gcol + '" stroke-width="1"/>';
      ylab += '<text x="' + (pl - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="' + tcol + '" font-family="DM Sans, sans-serif">' + (opt.pct ? v.toFixed(0) + '%' : Math.round(v)) + '</text>';
    }
    var xlab = '', ticks = Math.min(6, pts.length);
    for (var k = 0; k < ticks; k++) {
      var idx = Math.round((pts.length - 1) * (k / Math.max(ticks - 1, 1)));
      xlab += '<text x="' + xp(idx).toFixed(1) + '" y="' + (h - 7) + '" text-anchor="middle" font-size="10" fill="' + tcol + '" font-family="DM Sans, sans-serif">' + dlab(pts[idx][0]) + '</text>';
    }
    var col = opt.color || '#4ADE80', gid = 'g' + Math.random().toString(36).slice(2, 8);
    var lx = xp(pts.length - 1).toFixed(1), ly = yp(pts[pts.length - 1][1]).toFixed(1);
    return '<div class="chart-host" data-pts=\'' + JSON.stringify(pts) + '\' data-pl="' + pl + '" data-step="' + step + '" data-w="' + w + '" data-pct="' + (opt.pct ? 1 : 0) + '" data-unit="' + (opt.unit || '') + '">'
      + '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="height:' + h + 'px">'
      + '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + col + '" stop-opacity=".32"/><stop offset="100%" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>'
      + grid + ylab + xlab
      + '<path d="' + area + '" fill="url(#' + gid + ')"/>'
      + '<path class="pline" pathLength="1" d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/>'
      + '<circle cx="' + lx + '" cy="' + ly + '" r="4" fill="' + col + '"/>'
      + '<line class="cx" x1="0" y1="' + ptp + '" x2="0" y2="' + (ptp + ph) + '" stroke="' + col + '" stroke-width="1" opacity="0"/>'
      + '<circle class="hd" r="5" fill="#fff" stroke="' + col + '" stroke-width="2.5" opacity="0"/>'
      + '</svg></div>';
  }
  function wireCharts(root) {
    root.querySelectorAll('.chart-host').forEach(function (host) {
      var pts = JSON.parse(host.dataset.pts), pl = +host.dataset.pl, step = +host.dataset.step, w = +host.dataset.w;
      var isPct = host.dataset.pct === '1', unit = host.dataset.unit;
      var svg = host.querySelector('svg'), cx = host.querySelector('.cx'), hd = host.querySelector('.hd');
      function move(clientX, clientY) {
        var r = svg.getBoundingClientRect(), rel = (clientX - r.left) / r.width * w;
        var i = Math.max(0, Math.min(pts.length - 1, Math.round((rel - pl) / step)));
        var pxs = svg.querySelectorAll('path')[1].getAttribute('d').split(/[ML]/).filter(Boolean).map(function (s) { return s.split(','); });
        var p = pxs[i]; if (!p) return;
        cx.setAttribute('x1', p[0]); cx.setAttribute('x2', p[0]); cx.setAttribute('opacity', '.35');
        hd.setAttribute('cx', p[0]); hd.setAttribute('cy', p[1]); hd.setAttribute('opacity', '1');
        var d = pts[i], prev = i > 0 ? pts[i - 1][1] : null, ds = '';
        if (prev != null) {
          var diff = Math.round((d[1] - prev) * 100) / 100;
          ds = '<div class="tr" style="color:' + (diff > 0 ? '#4ADE80' : diff < 0 ? '#F08979' : '#C5D2E0') + '">' + (diff > 0 ? '+' : '') + diff + ' vs prev. day</div>';
        }
        showTip('<div class="tt">' + dlab(d[0]) + '</div><div class="tr"><b>' + (isPct ? f2(d[1]) + '%' : fmt(d[1])) + '</b> ' + unit + '</div>' + ds, clientX, clientY);
      }
      svg.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); });
      svg.addEventListener('mouseleave', function () { cx.setAttribute('opacity', '0'); hd.setAttribute('opacity', '0'); hideTip(); });
    });
  }
  function barChart(items) {
    if (!items.length) return '<div class="empty">No data in this period.</div>';
    var mx = Math.max.apply(null, items.map(function (i) { return i.v; })) || 1;
    return '<div class="bars">' + items.map(function (i) {
      var ht = i.v > 0 ? Math.max(4, i.v / mx * 100) : 0;
      return '<div class="bcol' + (i.faded ? ' faded' : '') + '"><div class="bfill' + (i.hi ? ' hi' : i.good ? ' g' : '') + '" style="height:0" data-gh="' + ht.toFixed(1) + '%"><span>' + i.t + '</span></div>'
        + '<div class="bx">' + i.x + '</div>' + (i.d != null ? '<div class="bd ' + (i.d >= 0 ? 'up' : 'down') + '">' + (i.d >= 0 ? '+' : '') + i.d.toFixed(2) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  // set the real bar/track sizes on the next frame so the CSS transition plays
  function animateGrow(root) {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        root.querySelectorAll('[data-gh]').forEach(function (e) { e.style.height = e.dataset.gh; });
        root.querySelectorAll('[data-gw]').forEach(function (e) { e.style.width = e.dataset.gw; });
      });
    });
  }
  // reset bars/lines to zero, then grow again, so the motion replays when a tab is opened
  function replayGrow(root) {
    if (!root) return;
    root.querySelectorAll('[data-gh]').forEach(function (e) { e.style.height = '0'; });
    root.querySelectorAll('[data-gw]').forEach(function (e) { e.style.width = '0'; });
    root.querySelectorAll('.pline').forEach(function (pl) { var c = pl.cloneNode(true); pl.parentNode.replaceChild(c, pl); });
    animateGrow(root);
  }

  // ---------- range ----------
  function shiftM(y, m, back) { var v = y * 12 + (m - 1) - back; return { y: Math.floor(v / 12), m: (v % 12) + 1 }; }
  var PRESETS = [['this', 'This month'], ['last', 'Last month'], ['3', 'Last 3 months'], ['6', 'Last 6 months'], ['12', 'Last 12 months'], ['ytd', 'Year to date'], ['all', 'All time']];
  function presetRange(id) {
    var n = new Date(), y = n.getFullYear(), m = n.getMonth() + 1;
    var first = function (yy, mm) { return yy + '-' + pad(mm) + '-01'; };
    var last = function (yy, mm) { return new Date(Date.UTC(yy, mm, 0)).toISOString().slice(0, 10); };
    switch (id) {
      case 'this': return [first(y, m), last(y, m)];
      case 'last': { var p = shiftM(y, m, 1); return [first(p.y, p.m), last(p.y, p.m)]; }
      case '3': { var a = shiftM(y, m, 2); return [first(a.y, a.m), MAXD]; }
      case '6': { var b = shiftM(y, m, 5); return [first(b.y, b.m), MAXD]; }
      case '12': { var c = shiftM(y, m, 11); return [first(c.y, c.m), MAXD]; }
      case 'ytd': return [y + '-01-01', MAXD];
      default: return [MIND, MAXD];
    }
  }
  function setRange(id) {
    var r = presetRange(id);
    state.preset = id; state.from = clampLo(r[0]); state.to = clampHi(r[1]);
    if (!dailyIn(state.from, state.to).length) { state.from = MIND; state.to = MAXD; state.preset = 'all'; }
    render();
  }

  // ---------- D2 ----------
  var STAGE_DEF = {
    assigned: 'Every candidate routed to a recruiter. Any row with a Date Assigned counts here.',
    interviewed: 'The recruiter marked the candidate as Interviewed rather than still Pending.',
    recommended: 'Assessment of Recommended, a clear endorsement to proceed.',
    reservations: 'Recommended with reservations: endorsed but flagged, for example pooling or a pending relocation decision.',
    orientation: 'The candidate has a Date of Scheduled Orientation booked.',
    pending: 'Assigned to a recruiter but not yet interviewed, with no assessment or orientation on file.',
    pooling: 'Assessment of Pooling: kept in the talent pool for a future or different requirement.',
    failed: 'Marked Failed: closed out (for example no longer interested or unreachable). Failed no longer counts as pending.',
    attended: 'Attended the orientation, either recorded as Attended orientation or already Endorsed. Comes from the recruiter\u2019s post-interview update.',
    finalEndorsed: 'Endorsement Status of Endorsed: the candidate completed orientation and was endorsed by the recruiter.',
    noShow: 'Endorsement Status of No-show: booked for orientation but did not turn up.',
    didNotProceed: 'Endorsement Status of Did not proceed: the candidate withdrew or was dropped after the interview.'
  };
  function funnelOf(list) {
    var st = function (s) { return list.filter(function (c) { return c.stage === s; }).length; };
    return {
      assigned: list.length,
      interviewed: list.filter(function (c) { return c.interviewed; }).length,
      recommended: st('Recommended'),
      reservations: st('Recommended with reservations'),
      notRecommended: st('Not recommended'),
      orientation: st('Orientation Scheduled'),
      pending: list.filter(function (c) { return c.stage === 'Assigned'; }).length,
      pooling: st('Pooling'),
      failed: st('Failed'),
      attended: list.filter(isAttended).length,
      finalEndorsed: list.filter(isFinal).length,
      noShow: list.filter(function (c) { return epLc(c) === 'no-show'; }).length,
      didNotProceed: list.filter(function (c) { return epLc(c) === 'did not proceed'; }).length
    };
  }
  // Endorsement Status helpers (candidate rows carry the status text once the D2 engine has the endorsement fields)
  function epLc(c) { return String(c.endorsement || '').trim().toLowerCase(); }
  function isFinal(c) { return epLc(c) === 'endorsed'; }
  function isAttended(c) { return epLc(c) === 'attended orientation' || isFinal(c); }
  function hasEndorseData() {
    if (D2 && D2.candidates && D2.candidates.length && D2.candidates.some(function (c) { return 'endorsement' in c; })) return true;
    return !!(D2 && D2.overall_funnel && D2.overall_funnel.endorsed != null);
  }
  function d2Candidates() {
    if (!D2 || !D2.candidates || !D2.candidates.length) return null;
    return D2.candidates.filter(function (c) { var d = String(c.date || '').slice(0, 10); return d >= state.from && d <= state.to; });
  }
  function taNum(name){ var m=/^TA\s*(\d+)/i.exec(String(name||'')); return m?parseInt(m[1],10):9999; }
  function taOrder(a,b){ var na=taNum(a.ta), nb=taNum(b.ta); if(na!==nb) return na-nb; return String(a.ta).localeCompare(String(b.ta)); }
  function recruiterRows() {
    var list = d2Candidates(); if (!list) return null;
    var byTA = {};
    list.forEach(function (c) { var k = c.ta || 'Unassigned'; (byTA[k] = byTA[k] || []).push(c); });
    return Object.keys(byTA).map(function (k) {
      var f = funnelOf(byTA[k]);
      var endorsed = f.recommended + f.reservations;
      return { ta: k, f: f, a: f.assigned, i: f.interviewed, endorsed: endorsed, o: f.orientation,
        att: f.attended, fin: f.finalEndorsed, ns: f.noShow, dnp: f.didNotProceed,
        rate: f.assigned ? Math.round(f.interviewed / f.assigned * 100) : 0,
        erate: f.assigned ? Math.round(endorsed / f.assigned * 100) : 0,
        orate: f.assigned ? Math.round(f.orientation / f.assigned * 100) : 0,
        unlogged: f.assigned > 0 && f.interviewed === 0 && f.recommended === 0 && f.orientation === 0 };
    });
  }
  var TA_METRICS = { endorsed: ['Recommended', 'endorsed', ''], orientation: ['Orientation', 'o', ''], assigned: ['Assigned', 'a', ''], interviewed: ['Interviewed', 'i', ''] };
  if (typeof hasEndorseData === 'function') { TA_METRICS.att = ['Attended orientation', 'att', '']; TA_METRICS.fin = ['Endorsed', 'fin', '']; TA_METRICS.ns = ['No-show', 'ns', '']; TA_METRICS.dnp = ['Did not proceed', 'dnp', '']; }
  function taGraphHTML() {
    var rows = recruiterRows();
    if (!rows || !rows.length) return '<div class="empty">No recruiter activity in this period.</div>';
    if (state.taSel && state.taSel !== '__all__') {
      var row = rows.filter(function (r) { return r.ta === state.taSel; })[0];
      if (!row) { state.taSel = '__all__'; return taGraphHTML(); }
      var f = row.f;
      var st = [{ x: 'Assigned', v: f.assigned }, { x: 'Interviewed', v: f.interviewed }, { x: 'Recommended', v: f.recommended + f.reservations }, { x: 'Orientation', v: f.orientation }];
      if (hasEndorseData()) st = st.concat([{ x: 'Attended', v: f.attended }, { x: 'Endorsed', v: f.finalEndorsed }, { x: 'No-show', v: f.noShow }, { x: 'Did not proceed', v: f.didNotProceed }]);
      return '<div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">' + esc(row.ta) + ' &middot; ' + fmt(row.endorsed) + ' recommended &middot; ' + fmt(row.o) + ' orientation'
        + (hasEndorseData() ? ' &middot; ' + fmt(row.fin) + ' endorsed' : '') + '</div>'
        + barChart(st.map(function (x) { return { v: x.v, t: fmt(x.v), x: x.x, good: true }; }));
    }
    var mk = state.taMetric || 'rate', mc = TA_METRICS[mk], key = mc[1], unit = mc[2];
    var rr = rows.slice().sort(taOrder);
    var mx = Math.max.apply(null, rr.map(function (r) { return r[key]; })) || 1;
    var tog = '<div class="mtog">' + Object.keys(TA_METRICS).filter(function (k) { return hasEndorseData() || ['att', 'fin', 'ns', 'dnp'].indexOf(k) < 0; }).map(function (k) {
      return '<button class="mbtn' + (k === mk ? ' on' : '') + '" data-m="' + k + '">' + TA_METRICS[k][0] + '</button>';
    }).join('') + '</div>';
    var bars = rr.map(function (r) {
      var val = r[key], w = val > 0 ? Math.max(3, val / mx * 100) : 0;
      var tag = INACTIVE_TAS[r.ta] ? ' <span class="inact">inactive</span>' : (r.unlogged ? ' <span class="muted" style="font-weight:400">(no activity)</span>' : '');
      return '<div class="hb"><div class="hbl">' + esc(r.ta) + tag + '</div>'
        + '<div class="hbt"><div class="hbf" style="width:0" data-gw="' + w.toFixed(1) + '%"></div></div>'
        + '<div class="hbv num">' + fmt(val) + unit + '</div></div>';
    }).join('');
    return tog + '<div>' + bars + '</div>';
  }

  // ---------- period stats ----------
  function stats() {
    var f = state.from, t = state.to;
    var dd = dailyIn(f, t), aa = attIn(f, t), mIn = monthsIn(f, t);
    var len = daysBetween(f, t), pTo = addDays(f, -1), pFrom = addDays(pTo, -(len - 1));
    var pdd = dailyIn(pFrom, pTo), paa = attIn(pFrom, pTo), pM = monthsIn(pFrom, pTo);
    var trendIn = (D1.monthly_trend || []).filter(function (x) { return mIn.indexOf(x.monthNum) >= 0; });
    var trendPrev = (D1.monthly_trend || []).filter(function (x) { return pM.indexOf(x.monthNum) >= 0; });
    var hcNow = dd.length ? dd[dd.length - 1][1] : null, hcStart = dd.length ? dd[0][1] : null;
    var att = avg(aa.map(function (r) { return r[1]; })), pAtt = avg(paa.map(function (r) { return r[1]; }));
    var rates = trendIn.map(attrRate).filter(function (v) { return v != null; });
    var pRates = trendPrev.map(attrRate).filter(function (v) { return v != null; });
    var hired = trendIn.reduce(function (s, x) { return s + (x.hired || 0); }, 0);
    var attr = trendIn.reduce(function (s, x) { return s + (x.attrition || 0); }, 0);
    var pHired = trendPrev.reduce(function (s, x) { return s + (x.hired || 0); }, 0);
    var peak = trendIn.map(function (x) { return { m: x.month, r: attrRate(x) }; }).filter(function (x) { return x.r != null; }).sort(function (a, b) { return b.r - a.r; })[0];
    var mEnd = {}; DAILY.forEach(function (r) { mEnd[r[0].slice(0, 7)] = r[1]; });
    var mk = Object.keys(mEnd).sort(), full = mk.slice(0, mk.length - 1), slopes = [];
    for (var i = 1; i < full.length; i++) slopes.push(mEnd[full[i]] - mEnd[full[i - 1]]);
    return {
      dd: dd, aa: aa, mIn: mIn, trendIn: trendIn,
      hcNow: hcNow, hcDelta: (hcNow != null && hcStart != null) ? hcNow - hcStart : null,
      att: att, attDelta: (att != null && pAtt != null) ? att - pAtt : null,
      rate: avg(rates), hired: hired, attr: attr,
      hiredDelta: trendPrev.length ? hired - pHired : null,
      churn: hired ? Math.round(attr / hired * 100) : null,
      peak: peak, slope: avg(slopes)
    };
  }

  // ---------- render pieces ----------
  function renderKPIs(s) {
    var req = D1.total_required, fill = (s.hcNow && req) ? Math.round(s.hcNow / req * 1000) / 10 : null;
    var gap = req ? req - (s.hcNow || 0) : null;
    var k = [
      { lab: 'Manpower', val: fmt(s.hcNow) + ' <span class="sm">/ ' + fmt(req) + '</span>', ctx: 'Over period ' + deltaEl(s.hcDelta, '', true), cls: '' },
      { lab: 'Fill rate', val: (fill != null ? fill + '%' : '\u2014'), ctx: (gap != null ? fmt(gap) + ' short of target' : ''), cls: (fill != null && fill < 85) ? 'warn' : '' },
      { lab: 'Attendance', val: (s.att != null ? f2(s.att) + '%' : '\u2014'), ctx: 'vs prior period ' + deltaEl(s.attDelta, 'pp', true), cls: '' },
      { lab: 'Attrition rate', val: (s.rate != null ? f1(s.rate) + '%' : '\u2014') + ' <span class="sm">/mo</span>', ctx: s.peak ? ('peak ' + f1(s.peak.r) + '% in ' + mn3(s.peak.m)) : '', cls: (s.rate >= 6 ? 'crit' : s.rate >= 4 ? 'warn' : '') },
      { lab: 'Hired', val: fmt(s.hired), ctx: fmt(s.attr) + ' left &middot; ' + deltaEl(s.hiredDelta, '', true), cls: '' }
    ];
    document.getElementById('kpis').innerHTML = k.map(function (x) {
      return '<div class="kpi ' + x.cls + '"><div class="lab">' + x.lab + '</div><div class="val">' + x.val + '</div><div class="ctx">' + x.ctx + '</div></div>';
    }).join('');
  }

  function renderAlerts(s) {
    var a = [], cl = (D1.clients || []).filter(function (c) { return c.required; });
    var starved = cl.filter(function (c) { return c.active / c.required < .10; });
    if (starved.length) a.push({ t: 'c', tag: 'Critical', h: starved.map(function (c) { return c.client; }).join(' and ') + (starved.length > 1 ? ' are' : ' is') + ' effectively unstaffed',
      b: starved.map(function (c) { return c.client + ' has ' + fmt(c.active) + ' of ' + fmt(c.required) + ' required'; }).join('; ') + '.' });
    if (s.peak && s.peak.r >= 7) a.push({ t: 'w', tag: 'Retention', h: 'Attrition peaked at ' + f1(s.peak.r) + '% in ' + mn3(s.peak.m),
      b: 'About ' + Math.round(s.peak.r * 12) + '% annualised' + (s.churn != null ? '. ' + s.churn + '% of hiring this period replaced someone who left.' : '.') });
    var implied = s.hired - s.attr;
    if (s.hcDelta != null && Math.abs(implied - s.hcDelta) > 50) a.push({ t: 'w', tag: 'Data', h: 'Hiring figures do not reconcile with headcount',
      b: 'Hired minus attrition implies ' + (implied >= 0 ? '+' : '') + fmt(implied) + ' for this period, but headcount actually moved ' + (s.hcDelta >= 0 ? '+' : '') + fmt(s.hcDelta) + '. Worth a definition check with Global Mode.' });
    var big = cl.slice().sort(function (x, y) { return (y.required - y.active) - (x.required - x.active); })[0];
    if (big && !starved.some(function (c) { return c.client === big.client; }) && big.required - big.active > 0)
      a.push({ t: 'w', tag: 'Coverage', h: big.client + ' is ' + fmt(big.required - big.active) + ' short', b: 'The single largest shortfall across all accounts.' });
    document.getElementById('alerts').innerHTML = a.slice(0, 3).map(function (x) {
      return '<div class="al ' + x.t + '"><span class="tag">' + x.tag + '</span><div><b>' + x.h + '.</b> ' + x.b + '</div></div>';
    }).join('');
  }

      + '<div class="track"><i style="width:0" data-gw="' + fill + '%"></i></div><div class="tscale"><span>' + fill + '% filled</span><span>gap ' + fmt(gap) + '</span></div>'
      + '<p>Headcount is actually growing <b>' + (s.slope != null ? (s.slope >= 0 ? '+' : '') + s.slope.toFixed(0) : '\u2014') + '/month</b>, putting the target about <b>' + (months ? Math.round(months) : '\u2014') + ' months</b> out'

      + '</tbody></table></div></div>';

  function renderRetention(s) {
    var apts = s.aa.map(function (r) { return [r[0], r[1]]; });
    var h = '<div class="panel"><div class="ph"><div class="pt">Attendance rate, daily</div><div class="pmeta">' + (apts.length ? apts.length + ' days in period' : '') + '</div></div>'
      + lineChart(apts, { color: '#1F7A4C', pct: true, h: 168, unit: 'attendance' }) + '</div>';
    // month-over-month follows the selected period but always shows one extra month on
    // each side for context, so the selected month(s) are compared against their neighbours.
    // Selected months render solid; the context months either side render faded.
    var pmN = s.mIn.slice().sort(function (a, b) { return a - b; });
    var loM = (pmN[0] || 1) - 1, hiM = (pmN[pmN.length - 1] || 12) + 1;
    var inPer = function (mn) { return s.mIn.indexOf(mn) >= 0; };
    function win(arr) { return arr.filter(function (x) { return x.monthNum >= loM && x.monthNum <= hiM; }); }
    var am = win(D1.attendance_daily_monthly || []);
    var items = am.map(function (x, i) { return { v: x.rate_pct, t: f2(x.rate_pct), x: mn3(x.month), d: i > 0 ? Math.round((x.rate_pct - am[i - 1].rate_pct) * 100) / 100 : null, good: true, faded: !inPer(x.monthNum) }; });
    var atr = win(D1.monthly_trend || []);
    var ar = atr.map(function (x) { var r = attrRate(x); return { v: r || 0, t: f1(r), x: mn3(x.month), hi: !!(s.peak && x.month === s.peak.m), faded: !inPer(x.monthNum) }; });
    var momMeta = am.length ? (am.length > 1 ? mn3(am[0].month) + ' to ' + mn3(am[am.length - 1].month) + ' &middot; selected month solid' : mn3(am[0].month)) : '';
    h += '<div class="grid-eq" style="margin-top:14px">'
      + '<div class="panel"><div class="ph"><div class="pt">Attendance, month over month</div><div class="pmeta">' + momMeta + '</div></div>' + barChart(items) + '</div>'
      + '<div class="panel"><div class="ph"><div class="pt">Attrition rate</div><div class="pmeta">% of avg headcount</div></div>' + barChart(ar) + '</div></div>';
    // all-time records
    var closed = (D1.monthly_trend || []).filter(function (x) { return !x.is_current_month; });
    var adm = D1.attendance_daily_monthly || [];
    function ext(arr, key) { var s2 = arr.filter(function (x) { return x[key] != null; }).slice().sort(function (a, b) { return b[key] - a[key]; }); return [s2[0], s2[s2.length - 1]]; }
    var ra = ext(adm, 'rate_pct'), rh = ext(closed, 'hired'), rt = ext(closed, 'attrition');
    var peakD = DAILY.reduce(function (a, b) { return b[1] > a[1] ? b : a; });
    var lowD = DAILY.reduce(function (a, b) { return b[1] < a[1] ? b : a; });
    var cur = (D1.monthly_trend || [])[(D1.monthly_trend || []).length - 1] || {}, curA = adm[adm.length - 1] || {};
    h += '<div class="panel" style="margin-top:14px"><div class="ph"><div class="pt">All-time records</div><div class="pmeta">across ' + adm.length + ' months &middot; not affected by the period filter</div></div><div class="tw">'
      + '<table><thead><tr><th>Metric</th><th>Best</th><th>Worst</th><th class="r">Now</th></tr></thead><tbody>'
      + '<tr><td class="nm">Daily headcount</td><td class="best">' + fmt(peakD[1]) + ' &middot; ' + dlab(peakD[0]) + '</td><td class="worst">' + fmt(lowD[1]) + ' &middot; ' + dlab(lowD[0]) + '</td><td class="r num">' + fmt(D1.current_headcount) + '</td></tr>'
      + (ra[0] ? '<tr><td class="nm">Attendance</td><td class="best">' + f2(ra[0].rate_pct) + '% &middot; ' + mn3(ra[0].month) + '</td><td class="worst">' + f2(ra[1].rate_pct) + '% &middot; ' + mn3(ra[1].month) + '</td><td class="r num">' + f2(curA.rate_pct) + '%</td></tr>' : '')
      + (rh[0] ? '<tr><td class="nm">Hiring</td><td class="best">' + fmt(rh[0].hired) + ' &middot; ' + mn3(rh[0].month) + '</td><td class="worst">' + fmt(rh[1].hired) + ' &middot; ' + mn3(rh[1].month) + '</td><td class="r num">' + fmt(cur.hired) + ' <span class="muted" style="font-size:11px">' + mn3(cur.month) + ' so far</span></td></tr>' : '')
      + (rt[0] ? '<tr><td class="nm">Attrition (fewest best)</td><td class="best">' + fmt(rt[1].attrition) + ' &middot; ' + mn3(rt[1].month) + '</td><td class="worst">' + fmt(rt[0].attrition) + ' &middot; ' + mn3(rt[0].month) + '</td><td class="r num">' + fmt(cur.attrition) + ' <span class="muted" style="font-size:11px">' + mn3(cur.month) + ' so far</span></td></tr>' : '')
      + '</tbody></table></div><div class="cap">Best and worst compare complete months only. Hiring and attrition under Now are the current month to date, so they are not directly comparable with a full month.</div></div>';
    var rm = (D1.retention_monthly || []).filter(function (x) { return s.mIn.indexOf(x.monthNum) >= 0; });
    h += '<div class="panel" style="margin-top:14px"><div class="ph"><div class="pt">Retention</div><div class="pmeta">regular vs non-regular</div></div><div class="tw">'
      + '<table><thead><tr><th>Month</th><th class="r">Regular</th><th class="r">Non-regular</th></tr></thead><tbody>'
      + (rm.length ? rm.map(function (x) { return '<tr><td class="nm">' + mn3(x.month) + '</td><td class="r num">' + f1(x.regular_pct) + '%</td><td class="r num">' + f1(x.nonRegular_pct) + '%</td></tr>'; }).join('')
        : '<tr><td colspan="3" class="empty">Retention closes at month-end. No closed month in this period.</td></tr>')
      + '</tbody></table></div></div>';
    return h;
  }

  function renderLeadTime() {
    if (!LT || !LT.by_hour || !LT.by_hour.length) return '';
    var bh = LT.by_hour;
    var totAll = LT.total_sessions || 0;
    var peak = LT.peak_hour_all;
    var peakC = LT.peak_hour_complete;
    var am = (LT.ampm && LT.ampm.am) || { all: 0, complete: 0 };
    var pm = (LT.ampm && LT.ampm.pm) || { all: 0, complete: 0 };
    var amS = totAll ? Math.round(am.all / totAll * 100) : 0;
    var pmS = totAll ? Math.round(pm.all / totAll * 100) : 0;
    var shr = function (h) { var ap = h < 12 ? 'AM' : 'PM'; var hh = h % 12; if (hh === 0) hh = 12; return hh + ' ' + ap; };
    var shrt = function (h) { var ap = h < 12 ? 'am' : 'pm'; var hh = h % 12; if (hh === 0) hh = 12; return hh + ap; };
    var lgen = LT.generated_at ? new Date(LT.generated_at) : null;
    var lstr = lgen ? lgen.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Manila' }) + ' PHT' : '';

    var items = bh.map(function (x) {
      return { v: x.all, t: (x.hour === peak ? fmt(x.all) : ''), x: (x.hour % 3 === 0 ? shrt(x.hour) : ''), good: (x.hour === peak) };
    });
    var dow = {}; (LT.by_dow || []).forEach(function (d) { dow[d.dow] = d.all; });
    var busyMorning = peak != null && peak < 12;

    var h = '<div class="ins w"><div class="k">When applicants are active</div>'
      + '<div class="big">' + (peak != null ? shr(peak) : '&mdash;') + '</div>'
      + '<div class="pill g">' + (busyMorning ? 'Mornings run hottest' : 'Afternoons and evenings run hottest') + '</div>'
      + '<p>Across <b>' + fmt(totAll) + '</b> conversations, activity peaks around <b>' + (peak != null ? shr(peak) : '&mdash;') + '</b>. '
      + 'The split is <b>' + amS + '%</b> before noon versus <b>' + pmS + '%</b> after'
      + (peakC != null ? ', and completed leads also land most around <b>' + shr(peakC) + '</b>' : '') + '.</p></div>';
    h += '<div class="panel" style="margin-top:14px"><div class="ph"><div class="pt">Lead activity by hour</div>'
      + '<div class="pmeta">all activity &middot; Manila time &middot; not period filtered' + (lstr ? ' &middot; ' + lstr : '') + '</div></div>'
      + barChart(items)
      + '<div class="cap">Based on each applicant&rsquo;s most recent message time. The green bar is the busiest hour.</div></div>';
    h += '<div class="grid-eq" style="margin-top:14px">'
      + distroPanel('Busiest days', dow, ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'])
      + distroPanel('AM vs PM', { 'AM (before noon)': am.all, 'PM (noon onward)': pm.all }, ['AM (before noon)', 'PM (noon onward)'])
      + '</div>';
    return h;
  }

  function renderRecruit() {
    if (!D2) return '<div class="panel"><div class="empty">Recruitment data is not available right now.</div></div>';
    var list = d2Candidates(), ranged = !!list;
    var F = ranged ? funnelOf(list) : (function () {
      var o = D2.overall_funnel || {};
      return { assigned: o.assigned, interviewed: o.interviewed, recommended: o.recommended, reservations: o.recommendedWithReservations, notRecommended: o.notRecommended, orientation: o.orientationScheduled, pending: o.pending, pooling: o.pooling, failed: o.failed, attended: o.attendedOrientation, finalEndorsed: o.endorsed, noShow: o.noShow, didNotProceed: o.didNotProceed };
    })();
    if (!F || !F.assigned) return '<div class="panel"><div class="empty">No recruitment activity in this period.</div></div>';
    var stages = [
      { l: 'Assigned', v: F.assigned, c: 'var(--navy)', d: STAGE_DEF.assigned },
      { l: 'Interviewed', v: F.interviewed, c: 'var(--green)', d: STAGE_DEF.interviewed },
      { l: 'Recommended', v: F.recommended, c: '#4ADE80', d: STAGE_DEF.recommended },
      { l: 'With reservations', v: F.reservations, c: 'var(--amber)', d: STAGE_DEF.reservations },
      { l: 'Pooling', v: F.pooling, c: '#5B6BE0', d: STAGE_DEF.pooling },
      { l: 'Orientation scheduled', v: F.orientation, c: 'var(--green)', d: STAGE_DEF.orientation },
      { l: 'Failed', v: F.failed, c: 'var(--danger)', d: STAGE_DEF.failed }
    ];
    if (hasEndorseData()) {
      stages.splice(6, 0,
        { l: 'Attended orientation', v: F.attended || 0, c: 'var(--green)', d: STAGE_DEF.attended },
        { l: 'Endorsed', v: F.finalEndorsed || 0, c: '#4ADE80', d: STAGE_DEF.finalEndorsed },
        { l: 'No-show', v: F.noShow || 0, c: 'var(--amber)', d: STAGE_DEF.noShow },
        { l: 'Did not proceed', v: F.didNotProceed || 0, c: 'var(--danger)', d: STAGE_DEF.didNotProceed });
    }
    var h = '<div class="panel"><div class="ph"><div class="pt">Recruitment funnel</div><div class="pmeta">'
      + (ranged ? 'leads assigned ' + dlab(state.from) + ' to ' + dlab(state.to) : 'all time (not date filtered)') + '</div></div>';
    stages.forEach(function (st) {
      var pct = F.assigned ? (st.v / F.assigned * 100) : 0;
      h += '<div class="fn"><div class="fnl">' + st.l + info(st.l, st.d) + '</div>'
        + '<div class="fnt"><div class="fnf" style="width:' + pct.toFixed(1) + '%;background:' + st.c + '"></div></div>'
        + '<div class="fnc num">' + fmt(st.v) + '</div></div>';
    });
    if (ranged) h += '<div class="cap" style="margin:-4px 0 8px">This funnel follows the leads assigned in the period and shows where each one stands today. For the work TAs did in the period, see TA activity above.</div>';

      h += '<div class="panel" style="margin-top:14px"><div class="ph"><div class="pt">Recruiter league</div><div class="pmeta">in TA order &middot; recommendation, orientation &amp; endorsement counts</div></div><div class="tw">'
        + '<table><thead><tr><th>Recruiter</th><th class="r">Assigned</th><th class="r">Interviewed</th><th class="r">Recommended</th><th class="r">Orientation</th>' + (hasEndorseData() ? '<th class="r">Attended</th><th class="r">Endorsed</th><th class="r">No-show</th><th class="r">Did not proceed</th>' : '') + '</tr></thead><tbody>'

        + mt.map(function (c) {
          return '<tr><td class="nm">' + esc(c.month) + '</td><td class="r num">' + fmt(c.assigned) + '</td><td class="r num">' + fmt(c.interviewed) + '</td>'

  // ---------- TA activity by the day it was logged (Last Updated) ----------
  var ACTIVITY_START = '2026-10-07';
  function hasUpdated() { return !!(D2 && D2.candidates && D2.candidates.some(function (c) { return c.updated; })); }
  function renderActivity() {
    if (!D2 || !D2.candidates) return '';
    var head = '<div class="panel" style="margin-bottom:14px"><div class="ph"><div class="pt">TA activity in this period'
      + info('TA activity', 'Counts applicant records the TAs updated during the selected period, by the day of the update, whatever month the lead was assigned. Based on each record’s latest update, tracked since Oct 7, 2026 when the new TA form went live.')
      + '</div><div class="pmeta">updated ' + dlab(state.from) + ' to ' + dlab(state.to) + '</div></div>';
    if (!hasUpdated()) return head + '<div class="empty">Activity by date appears after the next hourly refresh.</div></div>';
    if (state.to < ACTIVITY_START) return head + '<div class="empty">Activity tracking started on Oct 7, 2026. Pick a period that includes October to see it.</div></div>';
    var list = D2.candidates.filter(function (c) { return c.updated && c.updated >= state.from && c.updated <= state.to; });
    var isRec = function (c) { return c.stage === 'Recommended' || c.stage === 'Recommended with reservations'; };
    var tot = { u: list.length, i: 0, na: 0, r: 0, o: 0, f: 0 };
    var byTA = {};
    D2.candidates.forEach(function (c) { if (c.ta && !INACTIVE_TAS[c.ta]) byTA[c.ta] = byTA[c.ta] || { ta: c.ta, u: 0, i: 0, na: 0, r: 0, o: 0, f: 0 }; });
    list.forEach(function (c) {
      var k = c.ta || 'Unassigned', r = byTA[k] = byTA[k] || { ta: k, u: 0, i: 0, na: 0, r: 0, o: 0, f: 0 };
      r.u++; if (c.interviewed) { r.i++; tot.i++; } if (c.noAnswer) { r.na++; tot.na++; }
      if (isRec(c)) { r.r++; tot.r++; } if (c.stage === 'Orientation Scheduled') { r.o++; tot.o++; }
      if (c.stage === 'Failed' || c.stage === 'Not recommended') { r.f++; tot.f++; }
    });
    var t = function (lab, v, ctx) { return '<div class="kpi"><div class="lab">' + lab + '</div><div class="val num">' + fmt(v) + '</div><div class="ctx">' + ctx + '</div></div>'; };
    var h = head + '<div class="act-kpis">'
      + t('Records updated', tot.u, 'by the TAs in this period')
      + t('Interviewed', tot.i, 'now marked Interviewed')
      + t('No Answer', tot.na, 'calls logged as unanswered')
      + t('Recommended', tot.r, 'incl. with reservations')
      + t('Orientation booked', tot.o, 'with a scheduled date') + '</div>';
    // daily bars (most recent 21 days of the period, from Oct 7)
    var days = [], d = state.to < MAXD ? state.to : MAXD, lo = state.from > ACTIVITY_START ? state.from : ACTIVITY_START;
    var today = new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
    if (d < today && state.to >= today) d = today;
    while (d >= lo && days.length < 21) { days.unshift(d); d = addDays(d, -1); }
    if (days.length > 1) {
      var cnt = {}; list.forEach(function (c) { cnt[c.updated] = (cnt[c.updated] || 0) + 1; });
      var mxd = Math.max.apply(null, days.map(function (x) { return cnt[x] || 0; }));
      h += '<div class="pt" style="margin:4px 0 22px">Records updated per day</div>'
        + barChart(days.map(function (x) { var v = cnt[x] || 0; return { v: v, t: v ? fmt(v) : '', x: dlab(x), good: v === mxd && v > 0 }; }));
    }
    var rows = Object.keys(byTA).map(function (k) { return byTA[k]; }).sort(taOrder);
    var cell = function (v) { return '<td class="r num' + (v ? '' : ' zero') + '">' + fmt(v) + '</td>'; };
    h += '<div class="tw" style="margin-top:18px"><table><thead><tr><th>Recruiter</th><th class="r">Updated</th><th class="r">Interviewed</th><th class="r">No Answer</th><th class="r">Recommended</th><th class="r">Orientation</th><th class="r">Failed / not rec.</th></tr></thead><tbody>'
      + rows.map(function (r) {
        return '<tr><td class="nm">' + esc(r.ta) + (r.u ? '' : ' <span class="muted" style="font-weight:400">(no updates)</span>') + '</td>'
          + cell(r.u) + cell(r.i) + cell(r.na) + cell(r.r) + cell(r.o) + cell(r.f) + '</tr>';
      }).join('') + '</tbody></table></div>'
      + '<div class="cap">Each record counts once, on the day of its most recent update, with its outcome as it stands now. So an applicant interviewed on Oct 8 and updated again on Oct 13 counts on Oct 13. Inactive recruiters are hidden.</div></div>';
    return h;
  }

  // ---------- applicants: demographics + location ----------
  function pctOf(n, tot) { return tot ? Math.round(n / tot * 100) : 0; }
  function tile(lab, val, tot, ctx) {
    return '<div class="kpi"><div class="lab">' + lab + '</div>'
      + '<div class="val">' + fmt(val) + (tot ? ' <span class="sm">' + pctOf(val, tot) + '%</span>' : '') + '</div>'
      + '<div class="ctx">' + ctx + '</div></div>';
  }
  function distroPanel(title, obj, order) {
    obj = obj || {};
    var keys = (order || Object.keys(obj)).filter(function (k) { return obj[k] != null; });
    Object.keys(obj).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
    if (!keys.length) return '<div class="panel"><div class="ph"><div class="pt">' + title + '</div></div><div class="empty">No data.</div></div>';
    var tot = keys.reduce(function (s, k) { return s + obj[k]; }, 0) || 1;
    var mx = Math.max.apply(null, keys.map(function (k) { return obj[k]; })) || 1;
    var rows = keys.map(function (k) {
      var v = obj[k], w = v > 0 ? Math.max(3, v / mx * 100) : 0;
      return '<div class="hb"><div class="hbl">' + esc(k) + '</div>'
        + '<div class="hbt"><div class="hbf" style="width:0" data-gw="' + w.toFixed(1) + '%"></div></div>'
        + '<div class="hbv num">' + fmt(v) + ' <span class="muted" style="font-weight:400">' + pctOf(v, tot) + '%</span></div></div>';
    }).join('');
    return '<div class="panel"><div class="ph"><div class="pt">' + title + '</div><div class="pmeta">' + fmt(tot) + ' total</div></div>' + rows + '</div>';
  }
  // location data for the current scope: 'all' = engine all-time precompute, 'period' = recomputed from candidates in range
  function locData() {
    if (state.locScope === 'period' && D2 && D2.candidates) {
      var list = D2.candidates.filter(function (c) { var d = String(c.date || '').slice(0, 10); return d >= state.from && d <= state.to; });
      var tiers = { Local: 0, Nearby: 0, Far: 0, Unknown: 0 }, overseas = 0, gm = {}, unmapped = 0;
      list.forEach(function (c) {
        var t = c.proximity || 'Unknown';
        if (tiers[t] == null) tiers[t] = 0;
        tiers[t]++;
        if (c.overseas) overseas++;
        if (c.lat == null || c.lng == null) { unmapped++; return; }
        var k = (c.place || '') + '|' + (c.province || '');
        if (!gm[k]) gm[k] = { name: c.place, province: c.province, lat: c.lat, lng: c.lng, level: c.level, tier: c.tier || t, count: 0 };
        gm[k].count++;
      });
      var points = Object.keys(gm).map(function (k) { return gm[k]; }).sort(function (a, b) { return b.count - a.count; });
      return { tiers: tiers, overseas: overseas, points: points, unmapped: unmapped, ranged: true };
    }
    var lp = (D2 && D2.location_proximity) || {};
    return { tiers: lp.tiers || {}, overseas: lp.overseas || 0, points: (D2 && D2.location_points) || [], unmapped: (D2 && D2.unmapped_count) || 0, ranged: false };
  }
  function renderApplicants() {
    if (!D2) return '<div class="panel"><div class="empty">Applicant data is not available right now.</div></div>';
    var dem = D2.demographics || {};
    var L0 = locData(), tiers = L0.tiers || {};
    var canPeriod = !!(D2.candidates && D2.candidates.length);
    var known = (tiers.Local || 0) + (tiers.Nearby || 0) + (tiers.Far || 0);
    var scopeLbl = L0.ranged ? (dlab(state.from) + ' to ' + dlab(state.to)) : 'all applicants to date';
    var h = '<div class="panel"><div class="ph"><div class="pt">Applicant demographics &amp; location</div><div class="pmeta">demographics are all applicants to date</div></div>'
      + '<p style="margin:0;font-size:13px;color:var(--muted);line-height:1.55">Age, gender, education, civil status and address are captured at interview, so applicants still awaiting an interview show as <b>Unknown</b>. Location is matched to a city or province centroid; proximity tiers are relative to Global Mode\u2019s CALABARZON detachments.</p></div>';
    // location scope toggle
    h += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 2px">'
      + '<span class="ctrl-lbl">Location</span>'
      + '<button class="pbtn' + (state.locScope === 'all' ? ' on' : '') + '" data-ls="all">All time (on call)</button>'
      + (canPeriod ? '<button class="pbtn' + (state.locScope === 'period' ? ' on' : '') + '" data-ls="period">This period</button>' : '')
      + '<span class="muted" style="font-size:12px">' + scopeLbl + '</span></div>';
    h += '<div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-top:8px">'
      + tile('Local', tiers.Local || 0, known, 'Laguna &middot; Cavite &middot; Batangas &middot; Rizal &middot; Quezon')
      + tile('Nearby', tiers.Nearby || 0, known, 'Metro Manila &middot; Bulacan &middot; Pampanga')
      + tile('Far', tiers.Far || 0, known, 'Outside the hiring region')
      + tile('Location unknown', tiers.Unknown || 0, null, 'No address captured yet')
      + '</div>'
      + (known ? '<div class="cap" style="margin-top:8px">Local, Nearby and Far percentages are out of the ' + fmt(known) + ' applicants with a known location, not all ' + fmt(known + (tiers.Unknown || 0)) + '. Treat them as indicative until more addresses are captured.</div>' : '');
    if (known && (tiers.Far || 0) > (tiers.Local || 0))
      h += '<div class="ins w" style="margin-top:14px"><div class="k">Sourcing signal</div>'
        + '<div class="big">' + pctOf(tiers.Far || 0, known) + '%</div>'
        + '<div class="pill w">Most located applicants are out of region</div>'
        + '<p>Of applicants whose location is known, <b>' + fmt(tiers.Far || 0) + '</b> are Far versus <b>' + fmt(tiers.Local || 0) + '</b> Local. For a local-hire mandate, that points to ad targeting pulling applicants who cannot easily be placed.</p></div>';
    var pts = L0.points || [];
    if (pts.length) {
      h += '<div class="panel" style="margin-top:14px"><div class="ph"><div class="pt">Applicants by location</div><div class="pmeta">' + scopeLbl + ' &middot; ' + pts.length + ' places mapped &middot; ' + fmt(L0.unmapped || 0) + ' without a usable address yet</div></div><div class="tw">'
        + '<table><thead><tr><th>Location</th><th>Province</th><th>Tier</th><th class="r">Applicants</th></tr></thead><tbody>'
        + pts.map(function (p) {
            var tcol = p.tier === 'Local' ? 'var(--green)' : p.tier === 'Nearby' ? 'var(--amber)' : p.tier === 'Far' ? 'var(--danger)' : 'var(--muted-2)';
            return '<tr><td class="nm">' + esc(p.name) + (p.level === 'province' ? ' <span class="muted" style="font-weight:400">(province)</span>' : '') + '</td>'
              + '<td>' + esc(p.province) + '</td>'
              + '<td><span style="color:' + tcol + ';font-weight:700">' + p.tier + '</span></td>'

        + '</tbody></table></div><div class="cap">Ranked by applicant count. This is the same data the map bubbles show.</div></div>';
    }
    h += '<div class="grid-eq" style="margin-top:14px">'
      + distroPanel('Age', dem.ageBands, ['Under 18', '18-24', '25-34', '35-44', '45+', 'Unknown'])

      + '</div>';
    h += '<div class="grid-eq" style="margin-top:14px">'
      + distroPanel('Education', dem.education, ['College', 'Vocational', 'High School', 'Elementary', 'Other/Unknown', 'Unknown'])
      + distroPanel('Civil status', dem.civilStatus, ['Single', 'Married', 'Widowed', 'Separated', 'Unknown'])
      + '</div>';
    h += '<div style="margin-top:14px">' + distroPanel('Dependents', dem.dependents, ['0', '1-2', '3+', 'Unknown']) + '</div>';
    return h;
  }
  // Self-contained SVG density map — no tiles, no external library, no API key.
  // Plots each area by its real lat/lng as a bubble sized by applicant count.
  function wireMap() {
    var el = document.getElementById('gmmap');
    if (!el) return;
    var tierColor = { Local: '#1F7A4C', Nearby: '#B4820F', Far: '#C24E3E', Unknown: '#5A6B7D' };
    var raw = (locData().points || []).filter(function (p) {
      return p.lat != null && p.lng != null && p.lat >= 4 && p.lat <= 22 && p.lng >= 116 && p.lng <= 128;
    });
    if (!raw.length) { el.innerHTML = '<div class="empty" style="padding:40px 20px;text-align:center">No mapped applicants in this view.</div>'; return; }

    // viewport bounds from the hiring region (Local + Nearby); fall back to all
    var core = raw.filter(function (p) { return p.tier === 'Local' || p.tier === 'Nearby'; });
    var base = core.length ? core : raw;
    var minLat = 1e9, maxLat = -1e9, minLng = 1e9, maxLng = -1e9;
    base.forEach(function (p) { minLat = Math.min(minLat, p.lat); maxLat = Math.max(maxLat, p.lat); minLng = Math.min(minLng, p.lng); maxLng = Math.max(maxLng, p.lng); });
    var padLat = (maxLat - minLat) * 0.22 || 0.4, padLng = (maxLng - minLng) * 0.22 || 0.4;
    minLat -= padLat; maxLat += padLat; minLng -= padLng; maxLng += padLng;

    // aspect-corrected equirectangular projection
    var midLat = (minLat + maxLat) / 2;
    var spanLng = (maxLng - minLng) * Math.cos(midLat * Math.PI / 180);
    var spanLat = (maxLat - minLat) || 1;
    var H = 480, W = Math.max(320, Math.min(1200, Math.round(H * (spanLng / spanLat))));
    function X(lng) { return (lng - minLng) / (maxLng - minLng) * W; }
    function Y(lat) { return (maxLat - lat) / (maxLat - minLat) * H; }

    var mx = raw.reduce(function (m, p) { return Math.max(m, p.count || 0); }, 1);

    // faint graticule with degree labels
    var grid = '';
    for (var lng = Math.ceil(minLng); lng <= Math.floor(maxLng); lng++) {
      var gx = X(lng).toFixed(1);
      grid += '<line x1="' + gx + '" y1="0" x2="' + gx + '" y2="' + H + '" stroke="var(--line)" stroke-width="1"/>'
        + '<text x="' + gx + '" y="14" fill="var(--muted)" font-size="10" text-anchor="middle" opacity="0.7">' + lng + '°E</text>';
    }
    for (var lat = Math.ceil(minLat); lat <= Math.floor(maxLat); lat++) {
      var gy = Y(lat).toFixed(1);
      grid += '<line x1="0" y1="' + gy + '" x2="' + W + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>'
        + '<text x="5" y="' + (gy - 4) + '" fill="var(--muted)" font-size="10" opacity="0.7">' + lat + '°N</text>';
    }

    // bubbles largest-first so small ones stay clickable on top; label the biggest few
    var sorted = raw.slice().sort(function (a, b) { return b.count - a.count; });
    var offMap = 0, bubbles = '', labels = '';
    sorted.forEach(function (p, i) {
      var x = X(p.lng), y = Y(p.lat);
      if (x < 0 || x > W || y < 0 || y > H) { offMap += (p.count || 0); return; }
      var col = tierColor[p.tier] || tierColor.Unknown;
      var r = 7 + Math.sqrt((p.count || 1) / mx) * 34;
      var dash = p.level === 'province' ? ' stroke-dasharray="5,3"' : '';
      bubbles += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + col + '" fill-opacity="0.5" stroke="' + col + '" stroke-width="1.5"' + dash + '>'
        + '<title>' + esc(p.name) + ', ' + esc(p.province) + ' - ' + fmt(p.count) + ' applicant' + (p.count === 1 ? '' : 's') + ' (' + p.tier + ')</title></circle>';
      if (r >= 13) bubbles += '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" style="paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:3px">' + fmt(p.count) + '</text>';
      if (i < 12) labels += '<text x="' + x.toFixed(1) + '" y="' + (y + r + 12).toFixed(1) + '" text-anchor="middle" font-size="11" fill="var(--text)">' + esc(p.name) + '</text>';
    });

    var legend = '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)">'
      + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1F7A4C;margin-right:5px"></span>Local</span>'
      + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#B4820F;margin-right:5px"></span>Nearby</span>'
      + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#C24E3E;margin-right:5px"></span>Far</span>'
      + (offMap ? '<span style="margin-left:auto">' + fmt(offMap) + ' far-province applicant' + (offMap === 1 ? '' : 's') + ' beyond this view (see table)</span>' : '')
      + '</div>';

    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block">'
      + '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--sunken)"/>'
      + grid + bubbles + labels + '</svg>' + legend;
  }

  // ---------- freshness ----------
  function freshness() {
    var gen = D1.generated_at ? new Date(D1.generated_at) : null;

    D1 = d1; D2 = d2; LT = lt || null;
    var m = {}; (D1.daily_headcount_history || []).forEach(function (x) { m[x.date] = x.headcount; });
    DAILY = Object.keys(m).sort().map(function (k) { return [k, m[k]]; });
    var a = {}; (D1.daily_attendance_history || []).forEach(function (x) { a[x.date] = x.rate_pct; });
    ATT = Object.keys(a).sort().map(function (k) { return [k, a[k]]; });
    if (!DAILY.length) throw new Error('no daily history');
    MIND = DAILY[0][0]; MAXD = DAILY[DAILY.length - 1][0];
    mAvgHc = {};
    var g = {}; DAILY.forEach(function (r) { (g[mnum(r[0])] = g[mnum(r[0])] || []).push(r[1]); });
    Object.keys(g).forEach(function (k) { mAvgHc[k] = avg(g[k]); });
  }
  function boot(r) {
    applyData(r[0], r[1], r[2]);
    lastSig = sigOf(r); lastCheck = Date.now(); booted = true;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('ctrl').style.display = 'block';
    initTabs(); setRange('6');
    loadExtra('team'); loadExtra('master');
    setInterval(checkForUpdates, REFRESH_MS);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Date.now() - lastCheck > 60000) checkForUpdates();
    });
  }
  // pulls the latest snapshot without reloading the page; keeps the chosen section, period and recruiter
  function checkForUpdates() {
    if (!booted) return;
    lastCheck = Date.now();
    fetchAll().then(function (r) {
      var sig = sigOf(r);
      if (sig === lastSig) return;
      var y = window.scrollY;
      applyData(r[0], r[1], r[2]);
      lastSig = sig;
      if (state.preset === 'custom') { state.from = clampLo(state.from); state.to = clampHi(state.to); render(); }
      else setRange(state.preset);
      window.scrollTo(0, y);
      var f = document.getElementById('fresh');
      if (f) f.innerHTML += ' &middot; <span class="updated-flash">updated just now</span>';
    }).catch(function () { /* keep showing the current data; the stale banner covers long outages */ });
  }

  fetchAll().then(boot).catch(function () {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  });
})();
</script></body></html>
