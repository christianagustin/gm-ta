<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Mode Lead Intake</title>
<style>
:root{--navy:#14213d;--green:#1f9d63;--green-d:#177a4d;--bg:#f4f6fa;--card:#fff;--line:#dfe4ee;--txt:#1b2333;--mut:#667086;--red:#d64545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:16px}
header .wrap,main{max-width:720px;margin:0 auto}
h1{font-size:18px;margin:0}
header small{color:#b9c3dc}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:15px;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.req{color:var(--red)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--txt)}
input:focus,select:focus{outline:2px solid var(--green);outline-offset:0}
.hint{font-size:12px;color:var(--mut);margin-top:3px}
button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:12px 22px;font:700 15px inherit;cursor:pointer;width:100%}
button:hover{background:var(--green-d)}
button:disabled{background:#9db8aa;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.msg.err{background:#fdecec;color:#8c1f1f;border:1px solid #f3bcbc}
.msg.ok{background:#e8f6ee;color:#15613d;border:1px solid #b7e1c8}
.hidden{display:none!important}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="who">Lead Intake</h1><small>Log applicants you sourced yourself: walk-ins, your own FB posts, referrals, job fairs. They go straight to your sheet.</small></div></header>
<main>
  <div id="banner"></div>
  <form id="f" class="hidden" novalidate>
    <div class="card"><h2>Applicant</h2><div class="grid">
      <div><label for="surname">Last Name <span class="req">*</span></label><input id="surname" autocomplete="off" required></div>
      <div><label for="first_name">First Name <span class="req">*</span></label><input id="first_name" autocomplete="off" required></div>
      <div><label for="middle_name">Middle Name</label><input id="middle_name" autocomplete="off"></div>
      <div><label for="contact_number">Contact Number <span class="req">*</span></label><input id="contact_number" inputmode="tel" placeholder="09XX-XXX-XXXX" required></div>
      <div><label for="birthday">Birthday</label><input id="birthday" type="date"><div class="hint">Age is computed from this</div></div>
      <div><label for="email">Email Address</label><input id="email" type="email" autocomplete="off"></div>
      <div class="full"><label for="address">Address</label><input id="address" placeholder="City / Municipality, Province"></div>
      <div><label for="education">Educational Background</label>
        <select id="education"><option value="">Select...</option><option>College Graduate</option><option>College undergraduate</option><option>Vocational Graduate</option><option>High School Graduate</option><option>Senior High School</option><option>Junior High School</option><option>Elementary</option></select></div>
      <div><label for="time_to_call">Best time to call</label><input id="time_to_call" placeholder="e.g. Weekdays after 5PM"></div>
    </div></div>
    <div class="card"><h2>Application</h2><div class="grid">
      <div class="full"><label for="position">Position Applied For <span class="req">*</span></label><input id="position" required></div>
      <div><label for="source">Source <span class="req">*</span></label><select id="source" required><option value="">Select...</option></select></div>
      <div><label for="source_reference">Source Reference</label><input id="source_reference" placeholder="e.g. who referred them, which job fair"></div>
      <div class="full"><label for="fb_link">FB Link</label><input id="fb_link" type="url" placeholder="https://www.facebook.com/..."></div>
    </div></div>
    <button id="save" type="submit">Add applicant</button>
  </form>
</main>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzjaJqcvtwxxpdS984NGVSLvElxzZQ-h7cFvgPT1Tb0lNAAwZ9LfBDcRX8i399CjNEa/exec';
const qs = new URLSearchParams(location.search), TA = qs.get('ta') || '', K = qs.get('k') || '';
const $ = id => document.getElementById(id);
const FIELDS = ['surname','first_name','middle_name','contact_number','birthday','email','address','education','time_to_call','position','source','source_reference','fb_link'];
const banner = (cls, text) => { $('banner').innerHTML = ''; if (text) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; $('banner').appendChild(d); window.scrollTo({top:0,behavior:'smooth'}); } };

async function getJSON(url, opts) {
  try { const r = await fetch(url, opts); return await r.json(); }
  catch (e) { return { ok: false, error: 'Network error. Check your connection and try again.' }; }
}

(async () => {
  if (!TA || !K) return banner('err', 'This link is incomplete. Please open your personal intake link again.');
  const j = await getJSON(API + '?action=self-info&ta=' + encodeURIComponent(TA) + '&k=' + encodeURIComponent(K));
  if (!j.ok) return banner('err', j.error || 'Could not load this link.');
  $('who').textContent = 'Lead Intake · ' + j.ta;
  j.sources.forEach(s => $('source').appendChild(new Option(s, s)));
  $('f').classList.remove('hidden');
})();

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const lead = {}; FIELDS.forEach(k => lead[k] = $(k).value.trim());
  const missing = ['surname','first_name','contact_number','position','source'].filter(k => !lead[k]);
  if (missing.length) { $(missing[0]).focus(); return banner('err', 'Please fill in all fields marked *.'); }
  $('save').disabled = true; $('save').textContent = 'Saving...';
  // text/plain avoids a CORS preflight the Apps Script web app cannot answer
  const j = await getJSON(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ mode: 'self', ta: TA, k: K, lead }) });
  $('save').disabled = false; $('save').textContent = 'Add applicant';
  if (!j.ok) return banner('err', j.error || 'Not saved. Please try again.');
  banner('ok', 'Saved as ' + j.leadId + ' in your sheet. You can add the next applicant.');
  $('f').reset();
});
</script>
</body>
</html>
